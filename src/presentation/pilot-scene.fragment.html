<div id="arabica-pilot-scene">
  <div class="pilot-heading">
    <span>M2 · Çalışma alanı</span>
    <span class="text-small text-muted">8,4 × 6,6 m · örnek ölçü</span>
  </div>
  <div class="pilot-stage">
    <canvas class="pilot-canvas cursor-interaction" role="img" aria-label="Çatısı açık örnek çalışma alanı. Zemin, kesit duvarları, giriş, malzeme köşesi, mobil iskele ve onaylı bodur usta. Sürükleyerek döndürün, tekerlekle yakınlaşın."></canvas>
    <span class="pilot-loading" role="status" aria-live="polite">Çalışma alanı hazırlanıyor…</span>
  </div>
  <div class="viz-controls">
    <label class="form-label">Bakış açısı <output class="pilot-yaw-value tabular-nums">45°</output>
      <input type="range" class="form-range pilot-yaw" min="-180" max="180" step="1" value="45" aria-label="Alanı döndür">
    </label>
    <label class="form-label">Yakınlık <output class="pilot-zoom-value tabular-nums">100%</output>
      <input type="range" class="form-range pilot-zoom" min="75" max="170" step="1" value="100" aria-label="Alana yakınlaş">
    </label>
  </div>
  <div class="viz-controls">
    <label class="form-label">İskele görünümü
      <select class="form-select pilot-scaffold" aria-label="İskele görünümü">
        <option value="ready">Kurulu</option>
        <option value="platform-set">Platform</option>
        <option value="braced">Çerçeve ve çaprazlar</option>
        <option value="frames-set">Çerçeveler</option>
        <option value="base-set">Ayaklar</option>
        <option value="staged">Parçalar</option>
      </select>
    </label>
    <label class="form-check">
      <input type="checkbox" class="form-check-input pilot-worker" checked>
      <span class="form-check-label">Ölçek için ustayı göster</span>
    </label>
  </div>
  <div class="text-small pilot-detail" role="status" aria-live="polite">Kurulu iskele · alan ve ölçek önizlemesi</div>
</div>
<style>
#arabica-pilot-scene{width:100%;color:var(--foreground)}
#arabica-pilot-scene .pilot-heading{display:flex;flex-wrap:wrap;gap:calc(var(--font-size-base)*.5);align-items:baseline;padding-right:100px}
#arabica-pilot-scene .pilot-stage{position:relative;width:100%;height:530px;overflow:hidden}
#arabica-pilot-scene .pilot-canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#arabica-pilot-scene .pilot-canvas:active{cursor:grabbing}
#arabica-pilot-scene .pilot-loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--foreground)}
#arabica-pilot-scene>.viz-controls,#arabica-pilot-scene>.pilot-detail{margin-top:calc(var(--font-size-base)*.5)}
@media(max-width:480px){#arabica-pilot-scene .pilot-stage{height:400px}}
</style>
<script data-three-runtime></script>
<script data-pilot-bundle></script>
